<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>فعاليات الجامعة الافتراضية السورية - جميع الفعاليات</title>

  <!-- Bootstrap RTL CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg sticky-top custom-navbar shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-calendar-event ms-2"></i>فعاليات الجامعة الافتراضية
      </a>
      <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <i class="bi bi-list fs-2 text-white"></i>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav gap-lg-2 text-center">
          <li class="nav-item">
            <a class="nav-link" href="index.html">الرئيسية</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="events.html">الفعاليات</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">من نحن</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contact.html">تواصل معنا</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="py-5 bg-light">
    <div class="container">
      <h2 class="text-center section-title">استكشف جميع الفعاليات</h2>

      <div class="row justify-content-center g-3 mb-2">
        <div class="col-md-4">
          <div class="input-group">
            <span class="input-group-text bg-white text-muted border-start-0">
              <i class="bi bi-search"></i>
            </span>
            <input type="text" id="searchInput" class="form-control border-end-0" placeholder="ابحث عن الفعاليات من خلال العنوان...">
          </div>
        </div>

        <div class="col-md-3">
          <div class="input-group">
            <span class="input-group-text bg-white text-muted border-start-0">
              <i class="bi bi-calendar"></i>
            </span>
            <input type="date" id="dateFilter" class="form-control border-end-0">
          </div>
        </div>

        <div class="col-md-3">
          <div class="input-group">
            <span class="input-group-text bg-white text-muted border-start-0">
              <i class="bi bi-tag"></i>
            </span>
            <select id="categoryFilter" class="form-select border-end-0">
              <option value="all">جميع الفئات</option>
              <option value="Educational">تعليمي</option>
              <option value="Culture">ثقافي</option>
              <option value="Technical">تقني</option>
              <option value="Sport">رياضي</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="py-5">
    <div class="container">
      <div class="row g-4" id="eventsContainer">
      </div>
    </div>
  </section>

  <footer class="site-footer py-4 text-center mt-5">
    <div class="container">
      <div class="d-flex justify-content-center gap-3 mb-3">
        <a href="#"><i class="fab fa-facebook-f fs-5"></i></a>
        <a href="#"><i class="fab fa-instagram fs-5"></i></a>
        <a href="#"><i class="fab fa-twitter fs-5"></i></a>
        <a href="#"><i class="fab fa-linkedin-in fs-5"></i></a>
      </div>
      <p class="small mb-0">© 2026 جميع الحقوق محفوظة - فعاليات الجامعة الافتراضية السورية.</p>
    </div>
  </footer>

  <button id="scrollTopBtn" title="الرجوع للأعلى">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const allEvents = [
      {
        title: "حفل تخرج طلاب الجامعة الافتراضية السورية",
        category: "Educational",
        categoryAr: "تعليمي",
        place: "دمشق",
        date: "15–20 أغسطس 2024 – 6:00 مساءً حتى 10:00 مساءً",
        description: "حفل تخرج رسمي تنظمه الجامعة الافتراضية السورية للاحتفاء بالخريجين الجدد من مختلف البرامج الأكاديمية.",
        image: "assets/imgs/img4.jpg"
      },
      {
        title: "ماراثون البرمجة للأطفال والشباب في سوريا",
        category: "Technical",
        categoryAr: "تقني",
        place: "دمشق",
        date: "15–20 أغسطس 2019 – 6:00 مساءً حتى 10:00 مساءً",
        description: "ماراثون برمجي للأطفال واليافعين يهدف إلى تطوير مهارات البرمجة وحل المشكلات.",
        image: "assets/imgs/img5.jpg"
      },
      {
        title: "ورشة عمل حول تقييم التعليم الافتراضي",
        category: "Educational",
        categoryAr: "تعليمي",
        place: "دمشق",
        date: "15–20 أغسطس 2017 – 6:00 مساءً حتى 10:00 مساءً",
        description: "ورشة عمل تركز على تقييم جودة وفعالية التعليم الافتراضي ومناقشة التحديات.",
        image: "assets/imgs/img6.jpg"
      },
      {
        title: "مؤتمر المحتوى المعرفي السوري",
        category: "Culture",
        categoryAr: "ثقافي",
        place: "دمشق",
        date: "يُحدد لاحقاً",
        description: "مؤتمر مخصص لإثراء المحتوى المعرفي الرقمي العربي.",
        image: "assets/imgs/img1.jpg"
      }
    ];

    const container = document.getElementById("eventsContainer");
    const searchInput = document.getElementById("searchInput");
    const dateFilter = document.getElementById("dateFilter");
    const categoryFilter = document.getElementById("categoryFilter");

    function renderEvents(events) {
      container.innerHTML = "";

      if (events.length === 0) {
        container.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="bi bi-calendar-x text-muted fs-1 mb-2 d-block"></i>
            <p class="text-muted">لم يتم العثور على أي فعاليات تطابق بحثك.</p>
          </div>
        `;
        return;
      }

      events.forEach(event => {
        container.innerHTML += `
          <div class="col-md-6 col-lg-4">
            <div class="card custom-card h-100 border-0 shadow-sm">
              <div class="position-relative">
                <img src="${event.image}" alt="${event.title}" class="card-img-top" style="height: 190px; object-fit: cover;">
                <span class="position-absolute top-0 end-0 m-2 badge badge-category">${event.categoryAr}</span>
              </div>

              <div class="card-body d-flex flex-column">
                <h5 class="card-title fw-bold text-dark fs-6 mb-2" style="min-height: 2.5rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                  ${event.title}
                </h5>

                <div class="small text-muted mb-3">
                  <div><i class="bi bi-clock ms-1 text-secondary"></i> ${event.date.split('–')[0]}</div>
                  <div><i class="bi bi-geo-alt ms-1 text-secondary"></i> ${event.place}</div>
                </div>

                <p class="card-text text-secondary small flex-grow-1 mb-3" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
                  ${event.description}
                </p>

                <div class="text-start mt-auto">
                  <button class="btn btn-svu btn-sm px-3" onclick='openEvent(${JSON.stringify(event)})'>
                    التفاصيل
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }

    function filterEvents() {
      const searchValue = searchInput.value.toLowerCase();
      const dateValue = dateFilter.value;
      const categoryValue = categoryFilter.value;

      const filtered = allEvents.filter(event => {
        const matchName = event.title.toLowerCase().includes(searchValue);
        const matchDate = !dateValue || event.date.includes(dateValue);
        const matchCategory = categoryValue === "all" || event.category.toLowerCase() === categoryValue.toLowerCase();

        return matchName && matchDate && matchCategory;
      });

      renderEvents(filtered);
    }

    function openEvent(eventData) {
      localStorage.setItem("selectedEvent", JSON.stringify(eventData));
      const similar = allEvents.filter(ev => ev.category === eventData.category && ev.title !== eventData.title);
      localStorage.setItem("similarEvents", JSON.stringify(similar));
      window.location.href = "event.html";
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedCategory = localStorage.getItem("selectedCategory");
      if (savedCategory) {
        categoryFilter.value = savedCategory;
        localStorage.removeItem("selectedCategory"); 
      }

      filterEvents();

      const scrollTopBtn = document.getElementById("scrollTopBtn");
      window.addEventListener("scroll", () => {
        if (window.scrollY > 300) {
          scrollTopBtn.style.display = "block";
        } else {
          scrollTopBtn.style.display = "none";
        }
      });

      scrollTopBtn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    searchInput.addEventListener("input", filterEvents);
    dateFilter.addEventListener("change", filterEvents);
    categoryFilter.addEventListener("change", filterEvents);
  </script>
</body>

</html>
