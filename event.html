<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>فعاليات الجامعة الافتراضية السورية - تفاصيل الفعالية</title>

  <!-- Bootstrap RTL CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg sticky-top custom-navbar shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-calendar-event ms-2"></i>فعاليات الجامعة الافتراضية
      </a>
      <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <i class="bi bi-list fs-2 text-white"></i>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav gap-lg-2 text-center">
          <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
          <li class="nav-item"><a class="nav-link active" href="events.html">الفعاليات</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">من نحن</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">تواصل معنا</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="py-5">
    <div class="container">

      <div class="mb-4">
        <a href="events.html" class="btn btn-outline-secondary btn-sm rounded-2">
          <i class="bi bi-arrow-right ms-1"></i> العودة إلى الفعاليات
        </a>
      </div>

      <div class="card custom-card border-0 shadow-sm p-3 p-md-4 mb-5" id="eventDetailCard">
        <div class="row g-4 align-items-center">
          <div class="col-lg-6">
            <div class="position-relative overflow-hidden rounded">
              <img id="eventImg" src="assets/imgs/img4.jpg" alt="صورة الفعالية" class="w-100 rounded" style="max-height: 380px; object-fit: cover;">
              <span id="eventCategoryBadge" class="position-absolute top-0 end-0 m-3 badge badge-category shadow-sm">
                الفئة
              </span>
            </div>
          </div>

          <div class="col-lg-6">
            <h2 id="eventTitle" class="fw-bold text-dark mb-3">عنوان الفعالية التجريبي</h2>

            <div class="mb-3 text-secondary border-bottom pb-3">
              <div class="d-flex align-items-center mb-2">
                <i class="bi bi-clock text-primary fs-5 ms-2"></i>
                <span id="eventDate" class="small">التاريخ والوقت</span>
              </div>
              <div class="d-flex align-items-center">
                <i class="bi bi-geo-alt text-primary fs-5 ms-2"></i>
                <span id="eventPlace" class="small">الموقع</span>
              </div>
            </div>

            <h6 class="fw-semibold text-dark mb-2">الوصف</h6>
            <p id="eventDescription" class="text-secondary small leading-relaxed mb-4">
              ستظهر هنا المعلومات التفصيلية حول الفعالية...
            </p>

            <button class="btn btn-svu px-4 py-2" onclick="alert('ميزة التسجيل ستتوفر قريباً!')">
              <i class="bi bi-ticket-perforated ms-2"></i>تسجيل / حضور
            </button>
          </div>
        </div>
      </div>

      <div class="mt-5">
        <h4 class="fw-bold section-title mb-4">فعاليات مشابهة</h4>
        <div class="row g-4" id="similarEventsContainer">
        </div>
      </div>

    </div>
  </section>

  <footer class="site-footer py-4 text-center mt-5">
    <div class="container">
      <div class="d-flex justify-content-center gap-3 mb-3">
        <a href="#"><i class="fab fa-facebook-f fs-5"></i></a>
        <a href="#"><i class="fab fa-instagram fs-5"></i></a>
        <a href="#"><i class="fab fa-twitter fs-5"></i></a>
        <a href="#"><i class="fab fa-linkedin-in fs-5"></i></a>
      </div>
      <p class="small mb-0">© 2026 جميع الحقوق محفوظة - فعاليات الجامعة الافتراضية السورية.</p>
    </div>
  </footer>

  <button id="scrollTopBtn" title="الرجوع للأعلى">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // قاموس لترجمة أسماء الفئات برمجياً عند عرضها في التفاصيل والفعاليات المشابهة
    const categoryTranslations = {
      "Educational": "تعليمي",
      "Technical": "تقني",
      "Culture": "ثقافي",
      "Sport": "رياضي"
    };

    document.addEventListener("DOMContentLoaded", () => {
      // 1. جلب بيانات الفعالية المحددة
      const selectedEventData = localStorage.getItem("selectedEvent");
      if (selectedEventData) {
        const event = JSON.parse(selectedEventData);

        document.getElementById("eventTitle").textContent = event.title || "تفاصيل الفعالية";
        document.getElementById("eventCategoryBadge").textContent = event.categoryAr || categoryTranslations[event.category] || event.category || "عام";
        document.getElementById("eventDate").textContent = event.date || "يُحدد لاحقاً";
        document.getElementById("eventPlace").textContent = event.place || "دمشق";
        document.getElementById("eventDescription").textContent = event.description || "لا يوجد وصف تفصيلي متوفر لهذه الفعالية.";
        if (event.image) {
          document.getElementById("eventImg").src = event.image;
        }
      }

      const similarEventsData = localStorage.getItem("similarEvents");
      const similarContainer = document.getElementById("similarEventsContainer");

      if (similarEventsData) {
        const similarEvents = JSON.parse(similarEventsData);

        if (similarEvents.length > 0) {
          similarContainer.innerHTML = "";
          similarEvents.forEach(item => {
            const catNameAr = item.categoryAr || categoryTranslations[item.category] || item.category || "عام";
            similarContainer.innerHTML += `
              <div class="col-md-4">
                <div class="card custom-card h-100 border-0 shadow-sm">
                  <img src="${item.image}" class="card-img-top" style="height: 160px; object-fit: cover;" alt="${item.title}">
                  <div class="card-body d-flex flex-column">
                    <span class="badge badge-category mb-2 align-self-start">${catNameAr}</span>
                    <h6 class="fw-bold text-dark mb-2 text-truncate">${item.title}</h6>
                    <p class="small text-muted mb-3"><i class="bi bi-geo-alt ms-1"></i>${item.place}</p>
                    <button class="btn btn-svu btn-sm mt-auto" onclick='openSimilarEvent(${JSON.stringify(item)})'>
                      عرض التفاصيل
                    </button>
                  </div>
                </div>
              </div>
            `;
          });
        } else {
          similarContainer.innerHTML = `<p class="text-muted small">لا توجد فعاليات مشابهة أخرى متاحة في الوقت الحالي.</p>`;
        }
      } else {
        similarContainer.innerHTML = `<p class="text-muted small">لا توجد فعاليات مشابهة أخرى متاحة في الوقت الحالي.</p>`;
      }

      const scrollTopBtn = document.getElementById("scrollTopBtn");
      window.addEventListener("scroll", () => {
        if (window.scrollY > 300) {
          scrollTopBtn.style.display = "block";
        } else {
          scrollTopBtn.style.display = "none";
        }
      });

      scrollTopBtn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    function openSimilarEvent(eventData) {
      localStorage.setItem("selectedEvent", JSON.stringify(eventData));
      window.location.reload();
    }
  </script>
</body>

</html>
